name: CF-DNS-Update-Emby

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto=GitHub自动测速更新; check=检查; scan=测速报告; apply_ip=应用指定IP'
        required: true
        default: auto
        type: choice
        options: [check, scan, apply_ip, auto]
      selected_ip:
        description: '仅 apply_ip 使用：填入在家里测速选出的 Cloudflare IPv4'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cf-dns-emby
  cancel-in-progress: false

jobs:
  update-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 测速与检查（错误立即停止，输出不含密钥）
        shell: bash
        env:
          MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
          SELECTED_IP: ${{ inputs.selected_ip }}
          CF_MEASUREMENT_LOCATION: github-hosted
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_RECORD_ID: ${{ secrets.CF_RECORD_ID }}
        run: |
          set -euo pipefail
          python3 --version
          case "$MODE" in
            check) python3 cf_dns.py --check-current ;;
            scan) python3 cf_dns.py ;;
            apply_ip)
              if [ -z "$SELECTED_IP" ]; then
                echo 'selected_ip 必填；DNS未更改。'
                exit 1
              fi
              python3 cf_dns.py --apply --ip "$SELECTED_IP"
              ;;
            auto)
              python3 cf_dns.py --apply
              ;;
            *) echo '未知模式；DNS未更改。'; exit 1 ;;
          esac
